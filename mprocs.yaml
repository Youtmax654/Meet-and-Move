procs:
  Mobile:
    cmd:
      $select: os
      windows: ["cmd", "/c", "npm run start:mobile"]
      linux: ["npm", "run", "start:mobile"]
  API:
    cmd:
      $select: os
      windows: ["cmd", "/c", "npm run start:api"]
      linux: ["npm", "run", "start:api"]
  PostgreSQL:
    cmd:
      $select: os
      windows: ["cmd", "/c", "cd db && docker compose up db"]
      linux: ["sh", "-c", "cd db && docker compose up db"]
  Redis:
    cmd:
      $select: os
      windows: ["cmd", "/c", "cd db && docker compose up redis"]
      linux: ["sh", "-c", "cd db && docker compose up redis"]